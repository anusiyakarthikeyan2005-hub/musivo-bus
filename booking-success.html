<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Booking Confirmed | Musivo</title><link rel="stylesheet" href="css/passenger.css"></head><body><div class="formCard center"><div class="success">✓</div><h1>Booking Confirmed!</h1><p>Your Musivo journey is ready.</p><div class="ticket"><p>Booking ID: <b id="bookingId"></b></p><p>Passenger: <b id="passenger"></b></p><p>Seat: <b id="seat"></b></p><p>Route: <b id="route"></b></p></div><button class="primary" onclick="location.href='my-bookings.html'">View My Bookings</button><button class="secondary" onclick="location.href='index.html'">Back Home</button></div><script>const b=JSON.parse(localStorage.getItem('lastBooking')||'null');if(b){bookingId.textContent=b.id;passenger.textContent=b.passenger.name;seat.textContent=b.seat;route.textContent=b.from+' → '+b.to;}</script></body></html>
