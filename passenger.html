<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passenger Details | Musivo</title><link rel="stylesheet" href="css/passenger.css"></head><body>
<div class="formCard"><h1>Passenger Details</h1><p>Enter details to complete your booking.</p><form id="passengerForm"><label>Full Name<input id="name" required></label><label>Age<input id="age" type="number" min="1" max="100" required></label><label>Phone Number<input id="phone" maxlength="10" pattern="[0-9]{10}" required></label><label>Email<input id="email" type="email" required></label><button class="primary" type="submit">Confirm Booking</button></form></div><script src="js/passenger.js"></script></body></html>
